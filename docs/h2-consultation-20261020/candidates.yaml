candidates:
  - id: DP_AS_PROPOSED
    name: 提案どおりの薄い永続化
    description: 直近Nタスクで一定割合以上有用な改善を、衝突しない追加か低優先度の合流でベースへ入れ、悪化時はロールバック。交絡改善は優先度を下げる
  - id: DP_GATED_ABLATION
    name: 改善版：個別アブレーションで合格したものだけ永続化
    description: 永続化の候補を1つずつ、ベースあり・なしの対照実行（凍結した評価セット）で検証し、効果が切り分けられたものだけ入れる。交絡改善は優先度を下げるのでなく保留
  - id: LIBRARY_ONLY
    name: Harness²どおりライブラリのみ（永続化しない）
    description: ベースは固定のまま、経験はライブラリから毎回取り出すだけにする
  - id: LIBRARY_PRIOR
    name: 代案：ライブラリ側で事前確率を上げる
    description: ベースは変えず、安定して有用な教訓をライブラリ内で「既定で提案される」優先エントリに格上げする
  - id: HUMAN_PROMOTION
    name: 代案：人がレビューしてベースへ昇格
    description: 永続化候補の自動検出までは行い、ベースへの反映は人のレビューとバージョン付きリリースで行う（スキル／CLIへの昇格）